<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>P.L.Z LUNC 소각 분류소 V4</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263f70,#09142a 80%);color:#fff;font-family:system-ui;min-height:100dvh}.wrap{max-width:530px;margin:auto;padding:15px 12px 30px}h1{text-align:center;font-size:21px;color:#ffd46a;margin:8px 0}.sub{text-align:center;color:#b7c7dd;font-size:12px;margin:8px 0 15px}.stats{display:flex;justify-content:space-around;gap:5px;background:#ffffff15;border-radius:12px;padding:11px 3px;font-size:13px}.stats b{color:#ffd46a}#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:29px 8px;justify-items:center;margin:23px auto 0}.tube{width:min(100%,104px);height:172px;position:relative;border:3px solid #96c9ec;border-top:0;border-radius:0 0 21px 21px;background:#ffffff0b;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px;padding:10px 5px 9px;cursor:pointer;touch-action:manipulation}.tube:before{content:'';position:absolute;top:0;left:-5px;right:-5px;height:7px;border-radius:8px;background:#96c9ec}.tube.selected{transform:translateY(-7px);box-shadow:0 0 0 3px #ffd46a,0 0 18px #ffd46a77}.tube.done{border-color:#f9bc42;box-shadow:0 0 13px #ffae3d77}.tube.done:before{background:#f9bc42}.coin{width:76%;height:31px;max-width:77px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;text-shadow:0 1px 3px #0008;border:2px solid #ffffff70;box-shadow:inset 0 -5px 0 #0003,0 3px 6px #0005}.burnmark{font-size:43px;margin:auto;filter:drop-shadow(0 0 12px #ff9e38)}.label{position:absolute;bottom:-22px;color:#b5c8e2;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:37px}.controls button{border:0;border-radius:11px;padding:13px 4px;font-weight:800;font-size:14px;color:#14213d;background:#ffd16c}.controls button:nth-child(2){background:#acd1f4}.controls button:nth-child(3){grid-column:span 2;background:#7de2b3}.controls button:disabled{opacity:.35}#msg{min-height:39px;text-align:center;color:#ffe1a0;font-size:14px;margin-top:14px}.help{text-align:center;font-size:12px;color:#a7b9d3;line-height:1.6}.burst{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:29px;font-weight:900;color:#ffcf60;pointer-events:none;animation:pop .9s forwards;text-shadow:0 0 22px orange;z-index:5}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-100%) scale(1.4)}}@media(max-width:350px){.tube{height:157px}.coin{height:27px}}</style></head><body><main class="wrap"><h1>🔥 P.L.Z LUNC 소각 분류소 V4</h1><div class="sub">끝없는 도전! 단계가 올라갈수록 색깔이 늘어나</div><div class="stats"><span>단계 <b id="level">1</b></span><span>이동 <b id="moves">0</b></span><span>완성 <b id="burned">0/5</b></span><span>최고 <b id="best">-</b></span></div><div id="board"></div><div id="msg" aria-live="polite">통을 선택한 뒤 옮길 통을 눌러!</div><div class="controls"><button id="restart">↻ 다시 섞기</button><button id="undo">↶ 한 수 취소 (1회)</button><button id="next" disabled>🏆 다음 단계 도전</button></div><p class="help">맨 위 코인 하나씩 이동 · 빈 통 또는 같은 색 위에만 이동<br>한 수 취소는 판당 1회 · 이동할 곳이 없으면 게임 오버!<br>4개가 모이면 불꽃으로 변해! · 실제 LUNC 소각은 발생하지 않아.</p></main><script>(()=>{const COLORS=['#f2b53d','#3ca8ee','#d06cf1','#49c88b','#ed6972','#8d91fa','#16b7bb','#f28cbd','#b0d455','#e88c47','#7cc6ed','#ba82e6'];const board=document.getElementById('board'),msg=document.getElementById('msg'),movesEl=document.getElementById('moves'),burnEl=document.getElementById('burned'),levelEl=document.getElementById('level'),bestEl=document.getElementById('best'),nextBtn=document.getElementById('next');let tubes=[],selected=-1,moves=0,level=1,history=[],finished=new Set(),won=false,gameOver=false,undoUsed=false;const capacity=4;let count=5;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function complete(t){return t.length===4&&t.every(x=>x===t[0])}function key(){return 'plz-sort-v4-best-'+count}function best(){try{return localStorage.getItem(key())||'-'}catch(e){return '-'}}function saveBest(){try{let old=Number(localStorage.getItem(key()));if(!old||moves<old)localStorage.setItem(key(),String(moves))}catch(e){}}function start(advance=false){if(advance)level++;count=Math.min(4+level,12);selected=-1;moves=0;history=[];finished=new Set();won=false;gameOver=false;undoUsed=false;let pool=[];for(let c=0;c<count;c++)for(let j=0;j<4;j++)pool.push(c);do{shuffle(pool);tubes=Array.from({length:count},(_,i)=>pool.slice(i*4,i*4+4))}while(tubes.some(complete));tubes.push([],[]);msg.textContent='통을 선택한 뒤 옮길 통을 눌러!';render()}function render(){board.innerHTML='';tubes.forEach((t,i)=>{let el=document.createElement('div');el.className='tube'+(selected===i?' selected':'')+(complete(t)?' done':'');el.setAttribute('role','button');el.setAttribute('aria-label',(i+1)+'번 통, '+t.length+'개');el.tabIndex=0;el.innerHTML='<span class="label">'+(i+1)+'번</span>';if(complete(t)){let flame=document.createElement('div');flame.className='burnmark';flame.textContent='🔥';el.appendChild(flame)}else t.forEach(v=>{let coin=document.createElement('div');coin.className='coin';coin.style.background=COLORS[v];coin.textContent='LUNC';el.appendChild(coin)});el.addEventListener('click',()=>tap(i));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i)}});board.appendChild(el)});movesEl.textContent=moves;burnEl.textContent=finished.size+'/'+count;levelEl.textContent=level;bestEl.textContent=best();nextBtn.disabled=!won;nextBtn.textContent='🏆 다음 단계 도전';document.getElementById('undo').disabled=undoUsed||!history.length||won}function burst(){let el=document.createElement('div');el.className='burst';el.textContent='🔥 분류 성공!';document.body.appendChild(el);setTimeout(()=>el.remove(),900)}function hasMove(){for(let i=0;i<tubes.length;i++){let a=tubes[i];if(!a.length||complete(a))continue;for(let j=0;j<tubes.length;j++){if(i===j)continue;let b=tubes[j];if(!complete(b)&&b.length<capacity&&(!b.length||b[b.length-1]===a[a.length-1]))return true}}return false}function tap(i){if(won||gameOver)return;if(selected<0){if(!tubes[i].length){msg.textContent='코인이 들어 있는 통을 먼저 골라줘!';return}if(complete(tubes[i])){msg.textContent='완성된 통은 움직일 수 없어!';return}selected=i;msg.textContent=(i+1)+'번 통 선택! 이동할 통을 눌러.';render();return}if(selected===i){selected=-1;msg.textContent='선택 취소';render();return}let from=tubes[selected],to=tubes[i];if(complete(to)||to.length===4||(to.length&&to[to.length-1]!==from[from.length-1])){selected=-1;msg.textContent='⚠️ 빈 통이나 같은 색 위에만 옮길 수 있어!';render();return}history.push({tubes:tubes.map(t=>t.slice()),moves,finished:[...finished]});to.push(from.pop());moves++;selected=-1;if(complete(to)){finished.add(i);burst();msg.textContent='🔥 '+finished.size+'개 통 완성!'}else msg.textContent='좋아! 다음 코인을 옮겨봐.';if(finished.size===count){won=true;saveBest();msg.textContent='🎉 '+moves+'번 이동으로 성공! '+'다음 단계에 도전해 봐!'}else if(!hasMove()){gameOver=true;msg.textContent='💀 이동 불가! 게임 오버.'+(undoUsed?' 다시 섞기에 도전해!':' 취소 1회로 살릴 수 있어!')}render()}document.getElementById('restart').onclick=()=>start(false);document.getElementById('undo').onclick=()=>{if(undoUsed){msg.textContent='⚠️ 한 수 취소는 한 판에 한 번만 가능해!';return}if(won){msg.textContent='성공한 판은 취소할 수 없어!';return}if(!history.length){msg.textContent='되돌릴 이동이 없어!';return}undoUsed=true;let s=history.pop();tubes=s.tubes;moves=s.moves;finished=new Set(s.finished);selected=-1;won=false;gameOver=false;msg.textContent='↶ 한 수 취소 사용 완료! 이제 취소할 수 없어.';render()};nextBtn.onclick=()=>{if(won)start(true)};start()})();</script></body></html>
